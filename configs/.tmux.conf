# ~/.tmux.conf – Tmux configuration
# Part of debian-startenv: https://github.com/mobenaus/debian-startenv

# ---- Prefix key: Ctrl+a ----
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ---- General settings ----
set -g history-limit 10000
set -g mouse on
set -g base-index 1          # windows start at 1
setw -g pane-base-index 1    # panes start at 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#T"
set -sg escape-time 10       # faster Esc handling (important for Neovim)
set -g focus-events on

# ---- True colour support ----
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm-256color:RGB"

# ---- Reload config ----
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ---- Split panes using | and - ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- New window keeping current path ----
bind c new-window -c "#{pane_current_path}"

# ---- Move between panes with vim keys ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Resize panes ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Vi mode in copy mode ----
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- Status bar ----
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left: session name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"

# Right: date and time
set -g status-right-length 60
set -g status-right "#[fg=#a6e3a1] %d-%b-%Y  %H:%M "

# Window tabs
setw -g window-status-format         " #I: #W "
setw -g window-status-current-format "#[bg=#cba6f7,fg=#1e1e2e,bold] #I: #W "
setw -g window-status-style          "fg=#6c7086"
setw -g window-status-current-style  "fg=#1e1e2e"

# Pane borders
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "bg=#f38ba8,fg=#1e1e2e,bold"
