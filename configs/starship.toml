# ~/.config/starship.toml – Starship prompt configuration
# Part of debian-startenv: https://github.com/mobenaus/debian-startenv
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#9A348E)\
$os\
$username\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$c\
$golang\
$java\
$nodejs\
$python\
$rust\
[](fg:#86BBD8 bg:#06969A)\
$docker_context\
$kubernetes\
[](fg:#06969A bg:#33658A)\
$time\
[ ](fg:#33658A)\
"""

[os]
disabled = false
style = "bg:#9A348E fg:#ffffff"

[os.symbols]
Ubuntu = " "
Debian = " "

[username]
show_always = true
style_user  = "bg:#9A348E fg:#ffffff"
style_root  = "bg:#9A348E fg:#ffffff"
format      = '[$user ]($style)'
disabled    = false

[directory]
style            = "bg:#DA627D fg:#ffffff"
format           = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = " "
"Pictures"  = " "

[c]
symbol = " "
style  = "bg:#86BBD8 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style  = "bg:#86BBD8 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style  = "bg:#86BBD8 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = " "
style  = "bg:#86BBD8 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = " "
style  = "bg:#86BBD8 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style  = "bg:#86BBD8 fg:#ffffff"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style  = "bg:#06969A fg:#ffffff"
format = '[ $symbol $context ]($style) $path'

[kubernetes]
disabled = false
style    = "bg:#06969A fg:#ffffff"
format   = '[ ⎈ $context ]($style)'

[git_branch]
symbol = ""
style  = "bg:#FCA17D fg:#ffffff"
format = '[ $symbol $branch ]($style)'

[git_status]
style  = "bg:#FCA17D fg:#ffffff"
format = '[$all_status$ahead_behind ]($style)'

[time]
disabled   = false
time_format = "%R"
style      = "bg:#33658A fg:#ffffff"
format     = '[ ♥ $time ]($style)'
